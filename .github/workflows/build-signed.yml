name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download dictionaries
        run: |
          set -e

          mkdir -p app/src/main/assets/dictionaries

          echo "Installing dictionary packages..."

          npm install --no-save \
            dictionary-es-ar@2.0.0 \
            dictionary-en \
            dictionary-de

          echo ""
          echo "=== Installed dictionaries ==="

          ls -lh node_modules/dictionary-es-ar/index.dic
          ls -lh node_modules/dictionary-en/index.dic
          ls -lh node_modules/dictionary-de/index.dic

          echo ""
          echo "Converting dictionaries..."

          # The first line of a Hunspell .dic file is the number
          # of entries. The remaining lines contain words,
          # optionally followed by Hunspell flags after '/'.
          #
          # DictionaryManager only needs the word itself.

          tail -n +2 node_modules/dictionary-es-ar/index.dic \
            | cut -d'/' -f1 \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > app/src/main/assets/dictionaries/es-AR.txt

          tail -n +2 node_modules/dictionary-en/index.dic \
            | cut -d'/' -f1 \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > app/src/main/assets/dictionaries/en.txt

          tail -n +2 node_modules/dictionary-de/index.dic \
            | cut -d'/' -f1 \
            | sed '/^[[:space:]]*$/d' \
            | sort -u \
            > app/src/main/assets/dictionaries/de.txt

          echo ""
          echo "=== Dictionary sizes ==="

          wc -l \
            app/src/main/assets/dictionaries/es-AR.txt \
            app/src/main/assets/dictionaries/en.txt \
            app/src/main/assets/dictionaries/de.txt

          echo ""
          echo "=== Dictionary files ==="

          ls -lh app/src/main/assets/dictionaries/

          echo ""
          echo "=== Spanish Argentina sample ==="

          head -n 10 \
            app/src/main/assets/dictionaries/es-AR.txt

          echo ""
          echo "=== English sample ==="

          head -n 10 \
            app/src/main/assets/dictionaries/en.txt

          echo ""
          echo "=== German sample ==="

          head -n 10 \
            app/src/main/assets/dictionaries/de.txt

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias pocketboard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pocketboard \
            -keypass pocketboard \
            -dname "CN=PocketBoard"

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias pocketboard \
            --ks-pass pass:pocketboard \
            --key-pass pass:pocketboard \
            --out PocketBoard.apk \
            aligned.apk

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            PocketBoard.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBoard-Signed
          path: PocketBoard.apk
          if-no-files-found: error
