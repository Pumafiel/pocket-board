name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

           - name: Download dictionaries
        run: |
          set -e

          mkdir -p app/src/main/assets/dictionaries

          echo "Installing dictionary packages..."

          npm install --no-save \
            dictionary-es-ar@2.0.0 \
            dictionary-en \
            dictionary-de

          echo ""
          echo "=== Installed dictionaries ==="

          ls -lh node_modules/dictionary-es-ar/index.dic
          ls -lh node_modules/dictionary-en/index.dic
          ls -lh node_modules/dictionary-de/index.dic

          echo ""
          echo "Converting dictionaries..."

          python3 <<'PY'
          from pathlib import Path

          dictionaries = {
              "es-AR": Path("node_modules/dictionary-es-ar/index.dic"),
              "en": Path("node_modules/dictionary-en/index.dic"),
              "de": Path("node_modules/dictionary-de/index.dic"),
          }

          output_dir = Path("app/src/main/assets/dictionaries")
          output_dir.mkdir(parents=True, exist_ok=True)

          for language, source in dictionaries.items():
              output = output_dir / f"{language}.txt"

              print(f"Processing {language}...")

              # Hunspell dictionaries are normally UTF-8, but some
              # dictionaries contain BOMs or metadata/comment lines.
              raw = source.read_bytes()

              text = raw.decode("utf-8-sig", errors="replace")

              lines = text.splitlines()

              words = set()

              # First line is normally the Hunspell entry count.
              for index, line in enumerate(lines):
                  line = line.strip()

                  if not line:
                      continue

                  if index == 0:
                      continue

                  # Hunspell comments / metadata.
                  if line.startswith("##"):
                      continue

                  # Remove Hunspell flags.
                  word = line.split("/", 1)[0].strip()

                  if not word:
                      continue

                  # Ignore metadata/license lines.
                  if any(
                      word.startswith(prefix)
                      for prefix in (
                          "Copyright",
                          "GPL",
                          "License:",
                          "There should",
                          "This is the dictionary",
                          "Version:",
                          "derived from",
                          "for igerman",
                          "of this dictionary",
                          "Modified versions",
                      )
                  ):
                      continue

                  # DictionaryManager expects one word per line.
                  if any(character.isspace() for character in word):
                      continue

                  # Keep alphabetic words, apostrophes and hyphens.
                  if not all(
                      character.isalpha()
                      or character in "'-"
                      for character in word
                  ):
                      continue

                  words.add(word.lower())

              with output.open(
                  "w",
                  encoding="utf-8",
                  newline="\n"
              ) as file:
                  for word in sorted(words):
                      file.write(word + "\n")

              print(
                  f"Generated {output}: "
                  f"{len(words)} words"
              )
          PY

          echo ""
          echo "=== Dictionary sizes ==="

          wc -l \
            app/src/main/assets/dictionaries/es-AR.txt \
            app/src/main/assets/dictionaries/en.txt \
            app/src/main/assets/dictionaries/de.txt

          echo ""
          echo "=== Dictionary files ==="

          ls -lh app/src/main/assets/dictionaries/

          echo ""
          echo "=== Spanish Argentina sample ==="

          head -n 10 \
            app/src/main/assets/dictionaries/es-AR.txt

          echo ""
          echo "=== English sample ==="

          head -n 10 \
            app/src/main/assets/dictionaries/en.txt

          echo ""
          echo "=== German sample ==="

          head -n 10 \
            app/src/main/assets/dictionaries/de.txt


      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -keystore release.keystore \
            -alias pocketboard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pocketboard \
            -keypass pocketboard \
            -dname "CN=PocketBoard"

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias pocketboard \
            --ks-pass pass:pocketboard \
            --key-pass pass:pocketboard \
            --out PocketBoard.apk \
            aligned.apk

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            PocketBoard.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBoard-Signed
          path: PocketBoard.apk
          if-no-files-found: error
