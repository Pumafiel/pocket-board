name: Build Signed APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/pocketboard-release.jks" \
            -alias pocketboard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pocketboard \
            -keypass pocketboard \
            -dname "CN=PocketBoard, OU=PocketBoard, O=PocketBoard, L=Unknown, ST=Unknown, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Align APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/pocketboard-release.jks" \
            --ks-key-alias pocketboard \
            --ks-pass pass:pocketboard \
            --key-pass pass:pocketboard \
            --out PocketBoard.apk \
            app-release-aligned.apk

      - name: Verify signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --verbose PocketBoard.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketBoard-Signed
          path: PocketBoard.apk
          if-no-files-found: error
