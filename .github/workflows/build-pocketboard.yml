name: PocketBoard Build

on:
  workflow_dispatch:
  push:
    branches:
      - Pocketboard-E
  pull_request:
    branches:
      - Pocketboard-E

permissions:
  contents: read

jobs:
  build:
    name: Build PocketBoard-E Release
    runs-on: ubuntu-24.04

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 17
      # -------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -------------------------------------------------------
      # Gradle
      # -------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -------------------------------------------------------
      # Hunspell tools
      # -------------------------------------------------------
      - name: Install Hunspell tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            hunspell-tools \
            curl

          echo ""
          echo "Hunspell tools:"
          command -v unmunch
          command -v wordforms || true

      # -------------------------------------------------------
      # Dictionary generator permissions
      # -------------------------------------------------------
      - name: Prepare dictionary generator
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/generate-dictionaries.sh

          test -x scripts/generate-dictionaries.sh

      # -------------------------------------------------------
      # Generate dictionaries
      # -------------------------------------------------------
      - name: Generate PocketBoard dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            generatePocketBoardDictionaries

      # -------------------------------------------------------
      # Validate dictionaries
      # -------------------------------------------------------
      - name: Validate PocketBoard dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            validatePocketBoardDictionaries

      # -------------------------------------------------------
      # Dictionary report
      # -------------------------------------------------------
      - name: Dictionary report
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PocketBoard dictionaries"
          echo "=========================================="

          for file in app/src/main/assets/dictionaries/*.dict
          do
            echo ""
            echo "FILE: ${file}"
            echo "SIZE:"
            du -h "${file}"

            echo "WORDS:"
            tail -n +2 "${file}" | wc -l
          done

          echo ""
          echo "Spanish mandatory forms:"

          grep -F -x "hago" \
            app/src/main/assets/dictionaries/es-AR.dict

          grep -F -x "veré" \
            app/src/main/assets/dictionaries/es-AR.dict

          grep -F -x "mañana" \
            app/src/main/assets/dictionaries/es-AR.dict

          grep -F -x "tenés" \
            app/src/main/assets/dictionaries/es-AR.dict

          grep -F -x "podés" \
            app/src/main/assets/dictionaries/es-AR.dict

          grep -F -x "hacés" \
            app/src/main/assets/dictionaries/es-AR.dict

      # -------------------------------------------------------
      # Build Release APK
      # -------------------------------------------------------
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            clean \
            assembleRelease

      # -------------------------------------------------------
      # Verify APK
      # -------------------------------------------------------
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/Pocketboard-E-release.apk"

          test -f "${APK}"

          echo ""
          echo "=========================================="
          echo "Release APK"
          echo "=========================================="

          ls -lh "${APK}"

          echo ""
          echo "APK:"
          file "${APK}"

      # -------------------------------------------------------
      # Upload Release APK
      # -------------------------------------------------------
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocketboard-E-release
          path: app/build/outputs/apk/release/Pocketboard-E-release.apk
          if-no-files-found: error
