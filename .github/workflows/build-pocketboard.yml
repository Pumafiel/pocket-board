name: PocketBoard Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocketboard-E
    runs-on: ubuntu-24.04

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 17
      # -------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -------------------------------------------------------
      # Gradle
      # -------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -------------------------------------------------------
      # Hunspell tools
      # -------------------------------------------------------

      - name: Install Hunspell tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            hunspell-tools \
            curl

          echo ""
          echo "Hunspell tools:"
          command -v unmunch
          command -v wordforms || true

      # -------------------------------------------------------
      # Prepare build scripts
      # -------------------------------------------------------

      - name: Prepare build scripts
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          chmod +x scripts/generate-dictionaries.sh

          test -x ./gradlew
          test -x scripts/generate-dictionaries.sh

      # -------------------------------------------------------
      # Generate dictionaries
      # -------------------------------------------------------

      - name: Generate PocketBoard dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            generatePocketBoardDictionaries

      # -------------------------------------------------------
      # Validate dictionaries
      # -------------------------------------------------------

      - name: Validate PocketBoard dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            validatePocketBoardDictionaries

      # -------------------------------------------------------
      # Dictionary report
      # -------------------------------------------------------

      - name: Dictionary report
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PocketBoard dictionaries"
          echo "=========================================="

          for file in app/src/main/assets/dictionaries/*.dict
          do
            echo ""
            echo "FILE: ${file}"

            echo "SIZE:"
            du -h "${file}"

            echo "WORDS:"
            tail -n +2 "${file}" | wc -l
          done

          echo ""
          echo "Spanish dictionary checks:"

          for word in \
            "hago" \
            "veré" \
            "mañana" \
            "tenés" \
            "podés" \
            "hacés"
          do
            if grep -F -x -q \
              "${word}" \
              app/src/main/assets/dictionaries/es-AR.dict
            then
              echo "  OK      ${word}"
            else
              echo "  WARNING ${word}: missing"
            fi
          done

      # -------------------------------------------------------
      # Build release APK
      # -------------------------------------------------------

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            assembleRelease

      # -------------------------------------------------------
      # Build debug APK
      # -------------------------------------------------------

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            assembleDebug

      # -------------------------------------------------------
      # Upload release APK
      # -------------------------------------------------------

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocketboard-E-release
          path: app/build/outputs/apk/release/Pocketboard-E-release.apk
          if-no-files-found: error

      # -------------------------------------------------------
      # Upload debug APK
      # -------------------------------------------------------

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocketboard-E-debug
          path: app/build/outputs/apk/debug/Pocketboard-E-debug.apk
          if-no-files-found: error
