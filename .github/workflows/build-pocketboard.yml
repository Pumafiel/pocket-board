name: PocketBoard Build

on:
workflow_dispatch:

push:
branches:
- Pocketboard-E

pull_request:
branches:
- Pocketboard-E

permissions:
contents: read

jobs:
build:
name: Build Pocketboard-E
runs-on: ubuntu-24.04

steps:

  # -------------------------------------------------------
  # Checkout
  # -------------------------------------------------------

  - name: Checkout repository
    uses: actions/checkout@v4


  # -------------------------------------------------------
  # Java 17
  # -------------------------------------------------------

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'


  # -------------------------------------------------------
  # Gradle
  # -------------------------------------------------------

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4


  # -------------------------------------------------------
  # Hunspell tools
  # -------------------------------------------------------

  - name: Install Hunspell tools
    shell: bash
    run: |
      set -euo pipefail

      sudo apt-get update

      sudo apt-get install -y \
        hunspell-tools \
        curl

      echo ""
      echo "Hunspell tools:"
      command -v unmunch
      command -v wordforms || true


  # -------------------------------------------------------
  # Prepare build scripts
  # -------------------------------------------------------

  - name: Prepare build scripts
    shell: bash
    run: |
      set -euo pipefail

      chmod +x ./gradlew
      chmod +x scripts/generate-dictionaries.sh

      test -x ./gradlew
      test -x scripts/generate-dictionaries.sh


  # -------------------------------------------------------
  # Build release APK
  #
  # preBuild automatically:
  #
  #   - generates dictionaries
  #   - validates dictionaries
  #   - validates keyboard mappings
  #
  # Missing individual dictionary words are warnings only.
  # -------------------------------------------------------

  - name: Build release APK
    shell: bash
    run: |
      set -euo pipefail

      ./gradlew \
        --no-daemon \
        assembleRelease


  # -------------------------------------------------------
  # Build debug APK
  # -------------------------------------------------------

  - name: Build debug APK
    shell: bash
    run: |
      set -euo pipefail

      ./gradlew \
        --no-daemon \
        assembleDebug


  # -------------------------------------------------------
  # Upload release APK
  # -------------------------------------------------------

  - name: Upload release APK
    uses: actions/upload-artifact@v4
    with:
      name: Pocketboard-E-release
      path: app/build/outputs/apk/release/Pocketboard-E-release.apk
      if-no-files-found: error


  # -------------------------------------------------------
  # Upload debug APK
  # -------------------------------------------------------

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: Pocketboard-E-debug
      path: app/build/outputs/apk/debug/Pocketboard-E-debug.apk
      if-no-files-found: error
