name: PocketBoard Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-24.04

    steps:
      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Make Gradle wrapper executable
      # -------------------------------------------------------
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          test -x ./gradlew

          echo "Gradle wrapper is executable."

      # -------------------------------------------------------
      # Java 17
      # -------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -------------------------------------------------------
      # Gradle
      # -------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

          # -------------------------------------------------------
      # Hunspell
      # -------------------------------------------------------
      - name: Install Hunspell
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            hunspell \
            hunspell-tools

          echo ""
          echo "Hunspell installation:"
          command -v hunspell
          hunspell -v

          echo ""
          echo "Hunspell tools installation:"
          command -v unmunch

      # -------------------------------------------------------
      # Dictionary generator
      # -------------------------------------------------------
      - name: Prepare dictionary generator
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/generate-dictionaries.sh

          test -x scripts/generate-dictionaries.sh

      # -------------------------------------------------------
      # Generate dictionaries
      # -------------------------------------------------------
      - name: Generate PocketBoard dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            generatePocketBoardDictionaries

      # -------------------------------------------------------
      # Validate dictionaries
      # -------------------------------------------------------
      - name: Validate PocketBoard dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            validatePocketBoardDictionaries

      # -------------------------------------------------------
      # Restore the permanent release keystore
      # -------------------------------------------------------
      # Every previous run of this workflow generated a BRAND NEW,
      # random keystore here, so every release was signed with a
      # different certificate and Android refused to install any
      # of them as an update over the last one. This decodes the
      # one, permanent keystore stored in the repo's secrets
      # instead, so every build is signed identically.
      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/pocketboard-release.keystore"

          echo "${{ secrets.POCKETBOARD_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"

          test -s "$KEYSTORE"

          echo "POCKETBOARD_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "POCKETBOARD_KEYSTORE_PASSWORD=${{ secrets.POCKETBOARD_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "POCKETBOARD_KEY_ALIAS=pocketboard" >> "$GITHUB_ENV"
          # PKCS12 keystores use one password for both the store and
          # the key inside it (keytool enforces this), so this is
          # deliberately the same secret as above.
          echo "POCKETBOARD_KEY_PASSWORD=${{ secrets.POCKETBOARD_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Build ONLY Release
      # -------------------------------------------------------
      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            clean \
            assembleRelease

      # -------------------------------------------------------
      # Verify APK
      # -------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/Pocketboard-E-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"

          if [ ! -x "$APKSIGNER" ]; then
            echo "ERROR: apksigner was not found."
            exit 1
          fi

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$APK"

          echo ""
          echo "=========================================="
          echo "SIGNED RELEASE APK"
          echo "=========================================="

          ls -lh "$APK"

      # -------------------------------------------------------
      # Upload ONLY Release APK
      # -------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocketboard-E-release
          path: app/build/outputs/apk/release/Pocketboard-E-release.apk
          if-no-files-found: error
