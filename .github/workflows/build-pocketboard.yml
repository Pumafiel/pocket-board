name: PocketBoard Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Pocketboard-E
    runs-on: ubuntu-24.04

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 17
      # -------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # -------------------------------------------------------
      # Gradle
      # -------------------------------------------------------

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -------------------------------------------------------
      # Hunspell tools
      # -------------------------------------------------------

      - name: Install Hunspell tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            hunspell-tools \
            curl

          echo ""
          echo "Hunspell tools:"
          command -v unmunch
          command -v wordforms || true

      # -------------------------------------------------------
      # Prepare build scripts
      # -------------------------------------------------------

      - name: Prepare build scripts
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew
          chmod +x ./scripts/generate-dictionaries.sh

          test -x ./gradlew
          test -x ./scripts/generate-dictionaries.sh

      # -------------------------------------------------------
      # Build release APK
      # -------------------------------------------------------

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            assembleRelease

      # -------------------------------------------------------
      # Build debug APK
      # -------------------------------------------------------

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            assembleDebug

      # -------------------------------------------------------
      # APK report
      # -------------------------------------------------------

      - name: APK report
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PocketBoard APKs generated"
          echo "=========================================="

          echo ""
          echo "Release APK:"
          ls -lh app/build/outputs/apk/release/*.apk

          echo ""
          echo "Debug APK:"
          ls -lh app/build/outputs/apk/debug/*.apk

          echo ""
          echo "Build completed successfully."
