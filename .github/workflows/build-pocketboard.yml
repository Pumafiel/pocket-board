name: PocketBoard Manual Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PocketBoard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug
