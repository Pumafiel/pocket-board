name: PocketBoard Release

on:
  workflow_dispatch:
  push:
    branches:
      - Pocketboard-E

permissions:
  contents: read

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Hunspell tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y hunspell-tools

          command -v unmunch

      - name: Prepare dictionary generator
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/generate-dictionaries.sh

          test -x scripts/generate-dictionaries.sh

      - name: Generate dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            generatePocketBoardDictionaries

      - name: Validate dictionaries
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            validatePocketBoardDictionaries

      # -------------------------------------------------------
      # Generate temporary release keystore
      # -------------------------------------------------------
      - name: Generate release keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/pocketboard-release.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -alias pocketboard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pocketboard \
            -keypass pocketboard \
            -dname "CN=PocketBoard, OU=PocketBoard, O=PocketBoard, L=Buenos Aires, ST=Buenos Aires, C=AR"

          test -f "$KEYSTORE"

          echo "POCKETBOARD_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "POCKETBOARD_KEYSTORE_PASSWORD=pocketboard" >> "$GITHUB_ENV"
          echo "POCKETBOARD_KEY_ALIAS=pocketboard" >> "$GITHUB_ENV"
          echo "POCKETBOARD_KEY_PASSWORD=pocketboard" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Build only Release
      # -------------------------------------------------------
      - name: Build signed Release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            clean \
            assembleRelease

      # -------------------------------------------------------
      # Verify APK
      # -------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/Pocketboard-E-release.apk"

          test -f "$APK"

          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"

          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "=========================================="
          echo "SIGNED APK"
          echo "=========================================="

          ls -lh "$APK"

      # -------------------------------------------------------
      # Upload only Release APK
      # -------------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocketboard-E-release
          path: app/build/outputs/apk/release/Pocketboard-E-release.apk
          if-no-files-found: error
