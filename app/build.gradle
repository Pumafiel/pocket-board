import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.sinux.pocketboard"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "1.1.6"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'org.jetbrains:annotations:23.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}


/*
 * ============================================================
 * POCKETBOARD DICTIONARIES
 *
 * Source:
 *
 * https://github.com/wooorm/dictionaries
 *
 * We intentionally keep the Hunspell flags.
 *
 * Old format:
 *
 *     casa
 *     casas
 *     casamiento
 *
 * New format:
 *
 *     casa<TAB>...
 *
 * The flags are preserved so DictionaryManager can use the
 * linguistic information later instead of throwing it away
 * during the build.
 * ============================================================
 */

def dictionariesOutputDir =
        file("${projectDir}/src/main/assets/dictionaries")

def dictionariesVersion = "main"

def dictionarySources = [
        "es-AR": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.dic",
        "en"   : "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.dic",
        "de"   : "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.dic"
]


/*
 * Maximum number of raw entries kept from each dictionary.
 *
 * This is deliberately higher than the old 100000-word limit.
 * The resulting compressed APK remains reasonable while
 * preserving much more of the source dictionary.
 */
def maxDictionaryEntries = 250000


def isValidDictionaryWord = { String word ->

    if (word == null ||
            word.isEmpty() ||
            word.length() > 64) {

        return false
    }

    for (int i = 0; i < word.length(); i++) {

        char c = word.charAt(i)

        if (Character.isLetter(c) ||
                c == '\'' ||
                c == '-') {

            continue
        }

        return false
    }

    return true
}


def normalizeDictionaryWord = { String word ->

    return word
            .trim()
            .toLowerCase(Locale.ROOT)
}


/*
 * Converts a Hunspell .dic file into a compact PocketBoard
 * dictionary.
 *
 * Format:
 *
 *     word<TAB>flags
 *
 * Example:
 *
 *     casa<TAB>ABCD
 *
 * Entries without flags are also valid:
 *
 *     hola<TAB>
 */
def downloadAndConvertDictionary = {
    String language,
    String dictionaryUrlString ->

    File outputFile = new File(
            dictionariesOutputDir,
            "${language}.dict"
    )

    /*
     * Do not regenerate an existing dictionary.
     *
     * Delete the generated .dict manually when the upstream
     * dictionary needs to be refreshed.
     */
    if (outputFile.exists() &&
            outputFile.length() > 0) {

        println(
                "PocketBoard dictionary already exists: " +
                        outputFile.name
        )

        return
    }

    println(
            "Downloading PocketBoard dictionary: " +
                    language
    )

    dictionariesOutputDir.mkdirs()

    def connection =
            new URL(dictionaryUrlString).openConnection()

    connection.setConnectTimeout(30000)
    connection.setReadTimeout(120000)

    connection.setRequestProperty(
            "User-Agent",
            "PocketBoard-Build"
    )

    try {

        int responseCode =
                connection.getResponseCode()

        if (responseCode != 200) {

            throw new GradleException(
                    "Could not download " +
                            language +
                            " dictionary. HTTP " +
                            responseCode
            )
        }

        BufferedReader reader =
                new BufferedReader(
                        new InputStreamReader(
                                connection.getInputStream(),
                                "UTF-8"
                        )
                )

        try {

            /*
             * LinkedHashMap removes duplicate words while
             * preserving the first useful entry.
             */
            def entries =
                    new LinkedHashMap<String, String>()

            boolean firstLine = true

            String line

            while (
                    (line = reader.readLine()) != null
            ) {

                line = line.trim()

                if (line.isEmpty()) {
                    continue
                }

                /*
                 * First Hunspell line is the entry count.
                 */
                if (firstLine) {

                    firstLine = false
                    continue
                }

                /*
                 * Ignore comments.
                 */
                if (line.startsWith("#")) {
                    continue
                }

                /*
                 * Hunspell entries normally have:
                 *
                 *     word/FLAGS
                 *
                 * Keep both parts.
                 */
                String word = line
                String flags = ""

                int slash =
                        line.indexOf('/')

                if (slash >= 0) {

                    word =
                            line.substring(
                                    0,
                                    slash
                            )

                    if (slash + 1 < line.length()) {

                        flags =
                                line.substring(
                                        slash + 1
                                )
                    }
                }

                word =
                        normalizeDictionaryWord(
                                word
                        )

                flags =
                        flags.trim()

                if (!isValidDictionaryWord(word)) {
                    continue
                }

                /*
                 * The dictionary should contain only the compact
                 * information needed by the runtime.
                 *
                 * Hunspell affix rules themselves are not copied
                 * here. The flags are retained because they identify
                 * the linguistic classes of each entry.
                 */
                if (!entries.containsKey(word)) {

                    entries.put(
                            word,
                            flags
                    )
                }

                if (entries.size() >= maxDictionaryEntries) {
                    break
                }
            }

            /*
             * Sort words alphabetically.
             *
             * This makes prefix lookup deterministic and allows
             * DictionaryManager to use binary search/indexing.
             */
            def sortedWords =
                    new ArrayList<String>(
                            entries.keySet()
                    )

            Collections.sort(
                    sortedWords
            )

            outputFile.withWriter(
                    "UTF-8"
            ) { writer ->

                /*
                 * Header.
                 *
                 * Version allows DictionaryManager to reject
                 * incompatible future formats cleanly.
                 */
                writer.write(
                        "#POCKETBOARD-DICT-1"
                )

                writer.newLine()

                for (String word : sortedWords) {

                    String flags =
                            entries.get(word)

                    writer.write(word)
                    writer.write('\t')
                    writer.write(flags)
                    writer.newLine()
                }
            }

            println(
                    "PocketBoard dictionary generated: " +
                            outputFile.absolutePath +
                            " (" +
                            sortedWords.size() +
                            " entries)"
            )

        } finally {
            reader.close()
        }

    } finally {
        connection.disconnect()
    }
}


tasks.register(
        "downloadPocketBoardDictionaries"
) {

    outputs.dir(
            dictionariesOutputDir
    )

    doLast {

        dictionarySources.each {
            String language,
            String dictionaryUrl ->

            downloadAndConvertDictionary(
                    language,
                    dictionaryUrl
            )
        }
    }
}


/*
 * Dictionaries must exist before Android processes assets.
 */
tasks.named("preBuild") {

    dependsOn(
            "downloadPocketBoardDictionaries"
    )
}


/*
 * ============================================================
 * KEYBOARD MAPPING XML VALIDATION
 * ============================================================
 */

tasks.register(
        "validateKeyboardMappings"
) {

    dependsOn("build")

    doLast {

        def factory =
                SchemaFactory.newInstance(
                        XMLConstants.W3C_XML_SCHEMA_NS_URI
                )

        def schema =
                factory.newSchema(
                        new File(
                                "${rootProject.projectDir}/app/keyboard-mapping.xsd"
                        )
                )

        def validator =
                schema.newValidator()

        File xmlRoot =
                new File(
                        "${rootProject.projectDir}/app/src/main/res/xml/"
                )

        File[] keyboardMappings =
                xmlRoot.listFiles(
                        new FilenameFilter() {

                            @Override
                            boolean accept(
                                    File dir,
                                    String name
                            ) {

                                return name.startsWith(
                                        "keyboard_mapping_"
                                ) &&
                                        name.endsWith(
                                                ".xml"
                                        )
                            }
                        }
                )

        if (keyboardMappings == null) {
            return
        }

        for (
                File mappingFile :
                        keyboardMappings
        ) {

            println(
                    "Validating keyboard mapping: " +
                            mappingFile.name
            )

            validator.validate(
                    new StreamSource(
                            mappingFile
                    )
            )
        }
    }
}
