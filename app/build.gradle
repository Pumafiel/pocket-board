import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.sinux.pocketboard"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "1.1.6"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'org.jetbrains:annotations:23.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}


/*
 * ============================================================
 * POCKETBOARD HUNSPELL DICTIONARIES
 *
 * Source:
 *
 * https://github.com/wooorm/dictionaries
 *
 * We keep BOTH files:
 *
 *     *.dic  -> words + Hunspell flags
 *     *.aff  -> Hunspell rules
 *
 * The previous build converted .dic files into plain .txt
 * files and discarded the flags. That information is now
 * preserved for the new DictionaryManager.
 * ============================================================
 */

def dictionariesOutputDir =
        file("${projectDir}/src/main/assets/dictionaries")

def dictionariesVersion = "main"

def dictionarySources = [
        "es-AR": [
                "dic": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.dic",
                "aff": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.aff"
        ],
        "en": [
                "dic": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.dic",
                "aff": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.aff"
        ],
        "de": [
                "dic": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.dic",
                "aff": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.aff"
        ]
]


def downloadFile = {
    String language,
    String type,
    String urlString ->

    dictionariesOutputDir.mkdirs()

    File outputFile = new File(
            dictionariesOutputDir,
            "${language}.${type}"
    )

    println(
            "Downloading PocketBoard ${type}: " +
                    language
    )

    def connection =
            new URL(urlString).openConnection()

    connection.setConnectTimeout(30000)
    connection.setReadTimeout(120000)
    connection.setRequestProperty(
            "User-Agent",
            "PocketBoard-Build"
    )

    try {

        int responseCode =
                connection.getResponseCode()

        if (responseCode != 200) {

            throw new GradleException(
                    "Could not download " +
                            language +
                            " ." +
                            type +
                            " dictionary. HTTP " +
                            responseCode
            )
        }

        outputFile.withOutputStream { output ->

            connection.getInputStream().withCloseable { input ->

                byte[] buffer =
                        new byte[8192]

                int count

                while (
                        (count = input.read(buffer)) >= 0
                ) {

                    output.write(
                            buffer,
                            0,
                            count
                    )
                }
            }
        }

        if (outputFile.length() == 0) {

            throw new GradleException(
                    "Downloaded empty dictionary: " +
                            outputFile.absolutePath
            )
        }

        println(
                "PocketBoard dictionary saved: " +
                        outputFile.name +
                        " (" +
                        outputFile.length() +
                        " bytes)"
        )

    } finally {
        connection.disconnect()
    }
}


tasks.register(
        "downloadPocketBoardDictionaries"
) {

    outputs.dir(
            dictionariesOutputDir
    )

    doLast {

        /*
         * Remove the old generated TXT dictionaries.
         *
         * They contained only plain words and had already
         * discarded the Hunspell flags.
         */
        [
                "es-AR.txt",
                "en.txt",
                "de.txt"
        ].each { name ->

            File oldFile =
                    new File(
                            dictionariesOutputDir,
                            name
                    )

            if (oldFile.exists()) {

                println(
                        "Removing obsolete dictionary: " +
                                oldFile.name
                )

                oldFile.delete()
            }
        }


        dictionarySources.each {
            String language,
            Map<String, String> sources ->

            File dicFile =
                    new File(
                            dictionariesOutputDir,
                            "${language}.dic"
                    )

            File affFile =
                    new File(
                            dictionariesOutputDir,
                            "${language}.aff"
                    )

            /*
             * Download .dic only when missing.
             */
            if (!dicFile.exists() ||
                    dicFile.length() == 0) {

                downloadFile(
                        language,
                        "dic",
                        sources.dic
                )

            } else {

                println(
                        "PocketBoard dictionary already exists: " +
                                dicFile.name
                )
            }


            /*
             * Download .aff only when missing.
             */
            if (!affFile.exists() ||
                    affFile.length() == 0) {

                downloadFile(
                        language,
                        "aff",
                        sources.aff
                )

            } else {

                println(
                        "PocketBoard rules already exist: " +
                                affFile.name
                )
            }
        }
    }
}


/*
 * Dictionaries must exist before Android processes assets.
 */
tasks.named("preBuild") {

    dependsOn(
            "downloadPocketBoardDictionaries"
    )
}


/*
 * ============================================================
 * KEYBOARD MAPPING XML VALIDATION
 * ============================================================
 */

tasks.register(
        "validateKeyboardMappings"
) {

    dependsOn("build")

    doLast {

        def factory =
                SchemaFactory.newInstance(
                        XMLConstants.W3C_XML_SCHEMA_NS_URI
                )

        def schema =
                factory.newSchema(
                        new File(
                                "${rootProject.projectDir}/app/keyboard-mapping.xsd"
                        )
                )

        def validator =
                schema.newValidator()

        File xmlRoot =
                new File(
                        "${rootProject.projectDir}/app/src/main/res/xml/"
                )

        File[] keyboardMappings =
                xmlRoot.listFiles(
                        new FilenameFilter() {

                            @Override
                            boolean accept(
                                    File dir,
                                    String name
                            ) {

                                return name.startsWith(
                                        "keyboard_mapping_"
                                ) &&
                                        name.endsWith(
                                                ".xml"
                                        )
                            }
                        }
                )

        if (keyboardMappings == null) {
            return
        }

        for (
                File mappingFile :
                        keyboardMappings
        ) {

            println(
                    "Validating keyboard mapping: " +
                            mappingFile.name
            )

            validator.validate(
                    new StreamSource(
                            mappingFile
                    )
            )
        }
    }
}
