import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.sinux.pocketboard"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "1.1.6"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'org.jetbrains:annotations:23.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}


/*
 * ============================================================
 * POCKETBOARD HUNSPELL DICTIONARIES
 *
 * Source:
 * https://github.com/wooorm/dictionaries
 *
 * Languages:
 *
 * es-AR = Spanish (Argentina)
 * en    = English
 * de    = German
 *
 * We download the original Hunspell files:
 *
 *     .dic = dictionary entries
 *     .aff = affix/rules
 *
 * NO .txt conversion is performed.
 * ============================================================
 */

def dictionariesOutputDir =
        file("${projectDir}/src/main/assets/dictionaries")

def dictionariesVersion = "main"

def dictionarySources = [
        "es-AR": [
                "dic": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.dic",
                "aff": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.aff"
        ],

        "en": [
                "dic": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.dic",
                "aff": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.aff"
        ],

        "de": [
                "dic": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.dic",
                "aff": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.aff"
        ]
]


def downloadDictionaryFile = {
    String language,
    String extension,
    String url ->

    File outputFile =
            new File(
                    dictionariesOutputDir,
                    "${language}.${extension}"
            )

    if (outputFile.exists() &&
            outputFile.length() > 0) {

        println(
                "PocketBoard dictionary already exists: " +
                        outputFile.name
        )

        return
    }

    println(
            "Downloading PocketBoard dictionary: " +
                    outputFile.name
    )

    URL dictionaryUrl =
            new URL(url)

   URL dictionaryUrl = new URL(url)

def connection = dictionaryUrl.openConnection()

    connection.setConnectTimeout(30000)
    connection.setReadTimeout(120000)

    connection.setRequestProperty(
            "User-Agent",
            "PocketBoard-Build"
    )

    try {

        int responseCode =
                connection.getResponseCode()

        if (responseCode != HttpURLConnection.HTTP_OK) {

            throw new GradleException(
                    "Could not download " +
                            outputFile.name +
                            ". HTTP " +
                            responseCode
            )
        }

        dictionariesOutputDir.mkdirs()

        outputFile.withOutputStream { outputStream ->

            connection.getInputStream().withStream {
                inputStream ->

                byte[] buffer =
                        new byte[8192]

                int bytesRead

                while (
                        (bytesRead =
                                inputStream.read(buffer)) != -1
                ) {

                    outputStream.write(
                            buffer,
                            0,
                            bytesRead
                    )
                }
            }
        }

        if (outputFile.length() == 0) {

            outputFile.delete()

            throw new GradleException(
                    "Downloaded empty dictionary file: " +
                            outputFile.name
            )
        }

        println(
                "PocketBoard dictionary downloaded: " +
                        outputFile.absolutePath
        )

    } finally {

        connection.disconnect()
    }
}


task downloadPocketBoardDictionaries {

    outputs.dir(
            dictionariesOutputDir
    )

    doLast {

        dictionarySources.each {
            language, sources ->

            downloadDictionaryFile(
                    language,
                    "dic",
                    sources.dic
            )

            downloadDictionaryFile(
                    language,
                    "aff",
                    sources.aff
            )
        }
    }
}


/*
 * Make sure dictionaries exist before Android processes
 * the application's assets.
 */
tasks.named("preBuild") {

    dependsOn(
            downloadPocketBoardDictionaries
    )
}


/*
 * ============================================================
 * KEYBOARD MAPPING VALIDATION
 * ============================================================
 */

task validateKeyboardMappings {

    dependsOn 'build'

    def factory =
            SchemaFactory.newInstance(
                    XMLConstants.W3C_XML_SCHEMA_NS_URI
            )

    def schema =
            factory.newSchema(
                    new File(
                            "${rootProject.projectDir}/app/keyboard-mapping.xsd"
                    )
            )

    def validator =
            schema.newValidator()

    File xmlRoot =
            new File(
                    "${rootProject.projectDir}/app/src/main/res/xml/"
            )

    List<File> keyboardMappings =
            xmlRoot.listFiles(
                    new FilenameFilter() {

                        @Override
                        boolean accept(
                                File dir,
                                String name
                        ) {

                            return name.startsWith(
                                    "keyboard_mapping_"
                            ) &&
                                    name.endsWith(
                                            ".xml"
                                    )
                        }
                    }
            )

    for (File mappingFile : keyboardMappings) {

        validator.validate(
                new StreamSource(
                        mappingFile
                )
        )
    }
}
