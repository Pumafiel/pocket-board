import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.sinux.pocketboard"
        minSdk 28
        targetSdk 36

        versionCode 9
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'org.jetbrains:annotations:23.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}


/*
 * ============================================================
 * POCKETBOARD DICTIONARIES
 * ============================================================
 *
 * Source:
 *
 * https://github.com/wooorm/dictionaries
 *
 * We keep the Hunspell dictionary information instead of
 * reducing it to a plain word list.
 *
 * This allows DictionaryManager to use:
 *
 * - dictionary words
 * - Hunspell flags
 * - word frequency/ranking information when available
 * - language-specific spelling information
 *
 * The generated files are compact UTF-8 assets.
 * ============================================================
 */

def dictionariesOutputDir =
        file("${projectDir}/src/main/assets/dictionaries")

def dictionariesVersion = "main"

def dictionarySources = [
        "es-AR": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.dic",
        "en"   : "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.dic",
        "de"   : "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.dic"
]


/*
 * Download the original Hunspell dictionaries unchanged.
 *
 * Keeping the original .dic data is important:
 *
 *     casa/S
 *     abandonar/RED
 *
 * The part after '/' contains Hunspell information and must
 * not be discarded at build time.
 */
def downloadDictionary = {
    String language,
    String dictionaryUrlString ->

    File outputFile = new File(
            dictionariesOutputDir,
            "${language}.dic"
    )

    /*
     * Do not download again when the generated asset already
     * exists. Delete the file manually when forcing an update.
     */
    if (outputFile.exists() &&
            outputFile.length() > 0) {

        println(
                "PocketBoard dictionary already exists: " +
                        outputFile.name
        )

        return
    }

    println(
            "Downloading PocketBoard dictionary: " +
                    language
    )

    dictionariesOutputDir.mkdirs()

    def connection =
            new URL(dictionaryUrlString).openConnection()

    connection.setConnectTimeout(30000)
    connection.setReadTimeout(120000)
    connection.setRequestProperty(
            "User-Agent",
            "PocketBoard-Build"
    )

    try {

        int responseCode =
                connection.getResponseCode()

        if (responseCode != 200) {

            throw new GradleException(
                    "Could not download " +
                            language +
                            " dictionary. HTTP " +
                            responseCode
            )
        }

        outputFile.withOutputStream { output ->

            connection.getInputStream().withCloseable { input ->

                byte[] buffer = new byte[8192]
                int count

                while (
                        (count = input.read(buffer)) != -1
                ) {

                    output.write(
                            buffer,
                            0,
                            count
                    )
                }
            }
        }

        println(
                "PocketBoard dictionary generated: " +
                        outputFile.absolutePath
        )

    } finally {
        connection.disconnect()
    }
}


tasks.register(
        "downloadPocketBoardDictionaries"
) {

    outputs.dir(
            dictionariesOutputDir
    )

    doLast {

        dictionarySources.each {
            String language,
            String dictionaryUrl ->

            downloadDictionary(
                    language,
                    dictionaryUrl
            )
        }
    }
}


/*
 * Dictionaries must exist before Android processes assets.
 */
tasks.named("preBuild") {

    dependsOn(
            "downloadPocketBoardDictionaries"
    )
}


/*
 * ============================================================
 * KEYBOARD MAPPING XML VALIDATION
 * ============================================================
 */

tasks.register(
        "validateKeyboardMappings"
) {

    dependsOn("build")

    doLast {

        def factory =
                SchemaFactory.newInstance(
                        XMLConstants.W3C_XML_SCHEMA_NS_URI
                )

        def schema =
                factory.newSchema(
                        new File(
                                "${rootProject.projectDir}/app/keyboard-mapping.xsd"
                        )
                )

        def validator =
                schema.newValidator()

        File xmlRoot =
                new File(
                        "${rootProject.projectDir}/app/src/main/res/xml/"
                )

        File[] keyboardMappings =
                xmlRoot.listFiles(
                        new FilenameFilter() {

                            @Override
                            boolean accept(
                                    File dir,
                                    String name
                            ) {

                                return name.startsWith(
                                        "keyboard_mapping_"
                                ) &&
                                        name.endsWith(
                                                ".xml"
                                        )
                            }
                        }
                )

        if (keyboardMappings == null) {
            return
        }

        for (
                File mappingFile :
                        keyboardMappings
        ) {

            println(
                    "Validating keyboard mapping: " +
                            mappingFile.name
            )

            validator.validate(
                    new StreamSource(
                            mappingFile
                    )
            )
        }
    }
}
