plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sinux.pocketboard'
        minSdk 28
        targetSdk 36
        versionCode 116
        versionName '1.1.6'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            )
        }

        debug {
            minifyEnabled false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = 'Pocketboard-E-release.apk'
            } else if (variant.buildType.name == 'debug') {
                outputFileName = 'Pocketboard-E-debug.apk'
            }
        }
    }
}

/**
 * PocketBoard dictionary configuration.
 *
 * Dictionary generation is performed by:
 *
 *     scripts/generate-dictionaries.sh
 *
 * The generation task requires the external `unmunch` command.
 *
 * Missing/invalid dictionary files are fatal build errors.
 * Missing expected words are warnings only.
 */

def pocketBoardDictionaryDir = file(
    "${projectDir}/src/main/assets/dictionaries"
)

def pocketBoardDictionaryGenerator = file(
    "${rootProject.projectDir}/scripts/generate-dictionaries.sh"
)

def pocketBoardDictionaries = [
    'es-AR.dict',
    'en-en.dict',
    'de-de.dict'
]

def pocketBoardExpectedWords = [
    'es-AR': [
        'hago',
        'hacer',
        'veré',
        'mañana',
        'vos',
        'tenés',
        'podés',
        'hacés'
    ],

    'en-en': [
        'hello',
        'world'
    ],

    'de-de': [
        'hallo',
        'welt'
    ]
]

tasks.register('generatePocketBoardDictionaries', Exec) {
    group = 'pocketboard'
    description = 'Generate PocketBoard Hunspell dictionaries'

    workingDir rootProject.projectDir

    commandLine 'bash', pocketBoardDictionaryGenerator.absolutePath

    doFirst {
        if (!pocketBoardDictionaryGenerator.exists()) {
            throw new GradleException(
                "PocketBoard dictionary generator not found: " +
                pocketBoardDictionaryGenerator
            )
        }
    }
}

tasks.register('validatePocketBoardDictionaries') {
    group = 'verification'
    description = 'Validate PocketBoard generated dictionaries'

    dependsOn tasks.named('generatePocketBoardDictionaries')

    doLast {
        if (!pocketBoardDictionaryDir.exists()) {
            throw new GradleException(
                "PocketBoard dictionary directory does not exist: " +
                pocketBoardDictionaryDir
            )
        }

        /*
         * First validate the dictionary files themselves.
         *
         * Missing or empty files are technical failures and must stop
         * the build.
         */
        pocketBoardDictionaries.each { dictionaryName ->
            File dictionaryFile = new File(
                pocketBoardDictionaryDir,
                dictionaryName
            )

            if (!dictionaryFile.exists()) {
                throw new GradleException(
                    "PocketBoard dictionary is missing: " +
                    dictionaryFile
                )
            }

            if (dictionaryFile.length() == 0) {
                throw new GradleException(
                    "PocketBoard dictionary is empty: " +
                    dictionaryFile
                )
            }

            println(
                "Dictionary OK: " +
                dictionaryName +
                " (" +
                dictionaryFile.length() +
                " bytes)"
            )
        }

        /*
         * Then validate expected words.
         *
         * IMPORTANT:
         * A missing word is NOT a build failure.
         *
         * The dictionary may legitimately change when the upstream
         * linguistic source changes. We want visibility through a
         * warning without preventing the APK from being generated.
         */
        pocketBoardExpectedWords.each { language, words ->

            String dictionaryName = "${language}.dict"

            File dictionaryFile = new File(
                pocketBoardDictionaryDir,
                dictionaryName
            )

            if (!dictionaryFile.exists()) {
                /*
                 * This should already have been caught above, but keep
                 * this guard explicit.
                 */
                throw new GradleException(
                    "Dictionary required for validation is missing: " +
                    dictionaryFile
                )
            }

            Set<String> dictionaryWords = dictionaryFile
                .readLines('UTF-8')
                .drop(1)
                .collect {
                    it.trim().toLowerCase(Locale.ROOT)
                }
                .findAll {
                    !it.isEmpty()
                }
                .toSet()

            println("")
            println("Checking expected words for ${language}:")

            words.each { word ->

                String normalizedWord =
                    word.toLowerCase(Locale.ROOT)

                if (dictionaryWords.contains(normalizedWord)) {
                    println(
                        "  OK: ${word}"
                    )
                } else {
                    logger.warn(
                        "PocketBoard dictionary WARNING: " +
                        "${language} is missing expected word '${word}'"
                    )
                }
            }
        }

        println("")
        println(
            "PocketBoard dictionary validation completed."
        )
        println(
            "Missing expected words are warnings only."
        )
    }
}

/*
 * Make sure Android's preBuild happens only after dictionary
 * generation and validation.
 */
tasks.matching { task ->
    task.name == 'preBuild'
}.configureEach {
    dependsOn tasks.named('validatePocketBoardDictionaries')
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
