import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
id 'com.android.application'
}

android {
namespace 'com.sinux.pocketboard'
compileSdk 36

defaultConfig {
    applicationId "com.sinux.pocketboard"
    minSdk 28
    targetSdk 36
    versionCode 8
    versionName "1.1.6"
}

buildTypes {
    release {
        minifyEnabled true
        shrinkResources true
        proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
        ), 'proguard-rules.pro'
    }
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

testOptions {
    unitTests.returnDefaultValues = true
}

/*
 * Keep the application id and signing configuration untouched.
 *
 * Only rename the generated APK file.
 */
applicationVariants.all { variant ->

    variant.outputs.all { output ->

        outputFileName =
                "Pocketboard-E-${variant.buildType.name}.apk"
    }
}


}

dependencies {
implementation 'com.google.android.material:material:1.13.0'
implementation 'androidx.preference:preference:1.2.1'
implementation 'androidx.autofill:autofill:1.3.0'
implementation 'org.jetbrains:annotations:23.0.0'

testImplementation 'junit:junit:4.13.2'
testImplementation 'net.sf.kxml:kxml2:2.3.0'


}

/*

============================================================
POCKETBOARD DICTIONARIES
============================================================
Languages:
es-AR

en-en

de-de

Sources:
es-AR -> dictionary-es-ar

          generated by wooorm/dictionaries

          from RLA-ES / sbosio/rla-es

en-en -> dictionary-en

          wooorm/dictionaries

de-de -> dictionary-de

          wooorm/dictionaries

The source dictionaries are Hunspell pairs:
index.dic

index.aff

The .aff rules are NOT discarded.
GitHub Actions installs Hunspell tools and the build script
expands the dictionary using those rules.
Android receives only:
es-AR.dict

en-en.dict

de-de.dict

No Hunspell native library is packaged in the APK.
============================================================
*/

def dictionariesOutputDir =
file("${projectDir}/src/main/assets/dictionaries")

def dictionaryGenerator =
file(
"${rootProject.projectDir}/scripts/generate-dictionaries.sh"
)

tasks.register(
"generatePocketBoardDictionaries"
) {

outputs.dir(
        dictionariesOutputDir
)

doLast {

    if (!dictionaryGenerator.exists()) {

        throw new GradleException(
                "Missing dictionary generator:\n" +
                        dictionaryGenerator.absolutePath
        )
    }

    if (!dictionaryGenerator.canExecute()) {

        if (!dictionaryGenerator.setExecutable(
                true,
                false
        )) {

            throw new GradleException(
                    "Could not make dictionary generator executable:\n" +
                            dictionaryGenerator.absolutePath
            )
        }
    }

    println("")
    println(
            "============================================================"
    )
    println(
            " PocketBoard dictionary generation"
    )
    println(
            "============================================================"
    )

    exec {
        commandLine(
                "bash",
                dictionaryGenerator.absolutePath
        )
    }
}


}

/*

============================================================
DICTIONARY VALIDATION
============================================================
These words are mandatory for the current Spanish use case.
In particular:
hago

veré

mañana

tenés

podés

hacés

If one is missing, the build fails.
============================================================
*/

tasks.register(
"validatePocketBoardDictionaries"
) {

dependsOn(
        "generatePocketBoardDictionaries"
)

doLast {

    Map<String, List<String>> requiredWords = [

            "es-AR": [
                    "hago",
                    "hacer",
                    "veré",
                    "mañana",
                    "vos",
                    "tenés",
                    "podés",
                    "hacés"
            ],

            "en-en": [
                    "the",
                    "have",
                    "hello"
            ],

            "de-de": [
                    "ich",
                    "habe",
                    "morgen"
            ]
    ]

    requiredWords.each {
        String language,
        List<String> words ->

        File dictionaryFile =
                new File(
                        dictionariesOutputDir,
                        "${language}.dict"
                )

        if (!dictionaryFile.exists() ||
                dictionaryFile.length() == 0) {

            throw new GradleException(
                    "Missing or empty generated dictionary: " +
                            dictionaryFile.absolutePath
            )
        }

        Set<String> dictionaryWords =
                new HashSet<>()

        dictionaryFile.eachLine(
                "UTF-8"
        ) { String line ->

            line = line.trim()

            if (line.isEmpty() ||
                    line.startsWith("#")) {

                return
            }

            dictionaryWords.add(
                    line.toLowerCase(
                            Locale.ROOT
                    )
            )
        }

        println(
                "${language}: " +
                        dictionaryWords.size() +
                        " words"
        )

        words.each {
            String word ->

            if (!dictionaryWords.contains(
                    word.toLowerCase(
                            Locale.ROOT
                    )
            )) {

                throw new GradleException(
                        "Dictionary validation failed.\n" +
                                "Language: " +
                                language +
                                "\nMissing word: " +
                                word
                )
            }

            println(
                    "  OK  ${word}"
            )
        }
    }
}


}

tasks.named("preBuild") {

dependsOn(
        "validatePocketBoardDictionaries"
)


}

/*

============================================================
KEYBOARD MAPPING XML VALIDATION
============================================================
*/

tasks.register(
"validateKeyboardMappings"
) {

doLast {

    File schemaFile =
            new File(
                    "${rootProject.projectDir}/app/keyboard-mapping.xsd"
            )

    if (!schemaFile.exists()) {

        println(
                "Keyboard mapping schema not found; " +
                        "skipping XML validation."
        )

        return
    }

    def factory =
            SchemaFactory.newInstance(
                    XMLConstants.W3C_XML_SCHEMA_NS_URI
            )

    def schema =
            factory.newSchema(
                    schemaFile
            )

    def validator =
            schema.newValidator()

    File xmlRoot =
            new File(
                    "${rootProject.projectDir}/app/src/main/res/xml/"
            )

    if (!xmlRoot.exists()) {
        return
    }

    File[] keyboardMappings =
            xmlRoot.listFiles(
                    new FilenameFilter() {

                        @Override
                        boolean accept(
                                File dir,
                                String name
                        ) {

                            return name.startsWith(
                                    "keyboard_mapping_"
                            ) &&
                                    name.endsWith(
                                            ".xml"
                                    )
                        }
                    }
            )

    if (keyboardMappings == null) {
        return
    }

    for (
            File mappingFile :
                    keyboardMappings
    ) {

        println(
                "Validating keyboard mapping: " +
                        mappingFile.name
        )

        validator.validate(
                new StreamSource(
                        mappingFile
                )
        )
    }
}


}
