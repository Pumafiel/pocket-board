import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.sinux.pocketboard"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "1.1.6"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'org.jetbrains:annotations:23.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}


/*
 * ============================================================
 * POCKETBOARD DICTIONARIES
 * ============================================================
 *
 * Dictionary generation is handled by:
 *
 *     scripts/generate-dictionaries.sh
 *
 * The script:
 *
 *     - downloads Hunspell .dic files
 *     - downloads corresponding .aff files
 *     - validates both files
 *     - expands Hunspell rules with unmunch
 *     - normalizes the resulting word list
 *     - writes plain one-word-per-line dictionaries
 *
 * The Android application receives only the generated .dict
 * files.
 *
 * Missing individual regional words are warnings and do not
 * fail the build.
 * ============================================================
 */

def dictionariesOutputDir =
        file("${projectDir}/src/main/assets/dictionaries")

def dictionaryGenerator =
        file("${rootProject.projectDir}/scripts/generate-dictionaries.sh")


/*
 * ------------------------------------------------------------
 * Generate dictionaries
 * ------------------------------------------------------------
 *
 * This task deliberately delegates dictionary generation to
 * the repository script so that GitHub Actions and Gradle use
 * exactly the same generation logic.
 */

tasks.register(
        "generatePocketBoardDictionaries"
) {

    inputs.file(
            dictionaryGenerator
    )

    outputs.dir(
            dictionariesOutputDir
    )

    doLast {

        if (!dictionaryGenerator.exists()) {

            throw new GradleException(
                    "Dictionary generator not found: " +
                            dictionaryGenerator.absolutePath
            )
        }

        if (!dictionaryGenerator.canExecute()) {

            throw new GradleException(
                    "Dictionary generator is not executable: " +
                            dictionaryGenerator.absolutePath +
                            "\n" +
                            "Run: chmod +x " +
                            dictionaryGenerator.path
            )
        }

        println("")
        println(
                "============================================================"
        )
        println(
                " Generating PocketBoard dictionaries"
        )
        println(
                "============================================================"
        )
        println("")

        exec {
            commandLine(
                    "bash",
                    dictionaryGenerator.absolutePath
            )
        }
    }
}


/*
 * ------------------------------------------------------------
 * Validate generated dictionaries
 * ------------------------------------------------------------
 *
 * Individual words are quality checks only.
 *
 * Missing words generate WARNINGs and do NOT fail the build.
 *
 * Missing or empty dictionary files remain fatal because the
 * Android application cannot operate correctly without them.
 */

tasks.register(
        "validatePocketBoardDictionaries"
) {

    dependsOn(
            "generatePocketBoardDictionaries"
    )

    doLast {

        Map<String, List<String>> checkedWords = [

                "es-AR": [
                        "hago",
                        "hacer",
                        "veré",
                        "mañana",
                        "vos",
                        "tenés",
                        "podés",
                        "hacés"
                ],

                "en-en": [
                        "the",
                        "have",
                        "hello"
                ],

                "de-de": [
                        "ich",
                        "habe",
                        "morgen"
                ]
        ]

        int missingWords = 0

        checkedWords.each {
            String language,
            List<String> words ->

            File dictionaryFile =
                    new File(
                            dictionariesOutputDir,
                            "${language}.dict"
                    )

            /*
             * The dictionary itself is mandatory.
             */
            if (!dictionaryFile.exists() ||
                    dictionaryFile.length() == 0) {

                throw new GradleException(
                        "Missing or empty generated dictionary: " +
                                dictionaryFile.absolutePath
                )
            }

            Set<String> dictionaryWords =
                    new HashSet<>()

            dictionaryFile.eachLine(
                    "UTF-8"
            ) { String line ->

                line = line.trim()

                if (line.isEmpty() ||
                        line.startsWith("#")) {

                    return
                }

                dictionaryWords.add(
                        line.toLowerCase(
                                Locale.ROOT
                        )
                )
            }

            println(
                    "${language}: " +
                            dictionaryWords.size() +
                            " words"
            )

            words.each {
                String word ->

                String normalizedWord =
                        word.toLowerCase(
                                Locale.ROOT
                        )

                if (!dictionaryWords.contains(
                        normalizedWord
                )) {

                    println(
                            " WARNING ${language}: " +
                                    "missing word: " +
                                    word
                    )

                    missingWords++

                } else {

                    println(
                            " OK      ${language}: " +
                                    word
                    )
                }
            }
        }

        println("")
        println(
                "============================================================"
        )
        println(
                " Dictionary validation summary"
        )
        println(
                "============================================================"
        )

        if (missingWords > 0) {

            println(
                    "WARNING: " +
                            missingWords +
                            " optional word(s) were not found."
            )

            println(
                    "The build will continue."
            )

        } else {

            println(
                    "All dictionary word checks passed."
            )
        }

        println("")
    }
}


/*
 * Dictionaries must exist before Android processes assets.
 */
tasks.named("preBuild") {

    dependsOn(
            "validatePocketBoardDictionaries"
    )
}


/*
 * ============================================================
 * KEYBOARD MAPPING XML VALIDATION
 * ============================================================
 */

tasks.register(
        "validateKeyboardMappings"
) {

    dependsOn("build")

    doLast {

        def factory =
                SchemaFactory.newInstance(
                        XMLConstants.W3C_XML_SCHEMA_NS_URI
                )

        def schema =
                factory.newSchema(
                        new File(
                                "${rootProject.projectDir}/app/keyboard-mapping.xsd"
                        )
                )

        def validator =
                schema.newValidator()

        File xmlRoot =
                new File(
                        "${rootProject.projectDir}/app/src/main/res/xml/"
                )

        File[] keyboardMappings =
                xmlRoot.listFiles(
                        new FilenameFilter() {

                            @Override
                            boolean accept(
                                    File dir,
                                    String name
                            ) {

                                return name.startsWith(
                                        "keyboard_mapping_"
                                ) &&
                                        name.endsWith(
                                                ".xml"
                                        )
                            }
                        }
                )

        if (keyboardMappings == null) {
            return
        }

        for (
                File mappingFile :
                        keyboardMappings
        ) {

            println(
                    "Validating keyboard mapping: " +
                            mappingFile.name
            )

            validator.validate(
                    new StreamSource(
                            mappingFile
                    )
            )
        }
    }
}
