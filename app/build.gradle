import javax.xml.XMLConstants
import javax.xml.transform.stream.StreamSource
import javax.xml.validation.SchemaFactory

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sinux.pocketboard'
    compileSdk 36

    defaultConfig {
        applicationId "com.sinux.pocketboard"
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName "1.1.6"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'org.jetbrains:annotations:23.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}


/*
 * ============================================================
 * POCKETBOARD DICTIONARIES
 *
 * Dictionaries are downloaded from:
 *
 * https://github.com/wooorm/dictionaries
 *
 * Languages:
 *
 *     es-AR = Spanish (Argentina)
 *     en    = English (USA)
 *     de    = German
 *
 * The downloaded Hunspell .dic files are converted to the
 * simple one-word-per-line format expected by DictionaryManager.
 * ============================================================
 */

def dictionariesOutputDir =
        file("${projectDir}/src/main/assets/dictionaries")

def dictionariesVersion = "main"

def dictionarySources = [
        "es-AR": "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/es-AR/index.dic",
        "en"   : "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/en/index.dic",
        "de"   : "https://raw.githubusercontent.com/wooorm/dictionaries/${dictionariesVersion}/dictionaries/de/index.dic"
]

def downloadAndConvertDictionary = {
    String language,
    String dictionaryUrlString ->

    File outputFile = new File(
            dictionariesOutputDir,
            "${language}.txt"
    )

    /*
     * Do not download again if the generated dictionary
     * already exists.
     */
    if (outputFile.exists() &&
            outputFile.length() > 0) {

        println(
                "PocketBoard dictionary already exists: " +
                        outputFile.name
        )

        return
    }

    println(
            "Downloading PocketBoard dictionary: " +
                    language
    )

    dictionariesOutputDir.mkdirs()

    /*
     * Important:
     *
     * Do NOT declare a variable named dictionaryUrl here.
     * Groovy can interpret closure variables unexpectedly.
     */
    def connection =
            new URL(dictionaryUrlString).openConnection()

    connection.setConnectTimeout(30000)
    connection.setReadTimeout(120000)
    connection.setRequestProperty(
            "User-Agent",
            "PocketBoard-Build"
    )

    try {

        int responseCode =
                connection.getResponseCode()

        if (responseCode != 200) {

            throw new GradleException(
                    "Could not download " +
                            language +
                            " dictionary. HTTP " +
                            responseCode
            )
        }

        BufferedReader reader =
                new BufferedReader(
                        new InputStreamReader(
                                connection.getInputStream(),
                                "UTF-8"
                        )
                )

        try {

            outputFile.withWriter(
                    "UTF-8"
            ) { writer ->

                String line
                boolean firstLine = true

                while (
                        (line = reader.readLine()) != null
                ) {

                    line = line.trim()

                    if (line.isEmpty()) {
                        continue
                    }

                    /*
                     * Hunspell .dic first line:
                     *
                     *     number of entries
                     */
                    if (firstLine) {

                        firstLine = false
                        continue
                    }

                    /*
                     * Remove Hunspell flags.
                     *
                     * Example:
                     *
                     * casa/S
                     * abandonar/RED
                     */
                    int slash =
                            line.indexOf('/')

                    if (slash >= 0) {

                        line =
                                line.substring(
                                        0,
                                        slash
                                )
                    }

                    line = line.trim()

                    if (line.isEmpty()) {
                        continue
                    }

                    /*
                     * Ignore entries containing whitespace.
                     */
                    if (line.indexOf(' ') >= 0 ||
                            line.indexOf('\t') >= 0) {

                        continue
                    }

                    /*
                     * Keep only letters, apostrophes
                     * and hyphens.
                     */
                    boolean valid = true

                    for (
                            int i = 0;
                            i < line.length();
                            i++
                    ) {

                        char c =
                                line.charAt(i)

                        if (Character.isLetter(c) ||
                                c == '\'' ||
                                c == '-') {

                            continue
                        }

                        valid = false
                        break
                    }

                    if (!valid) {
                        continue
                    }

                    writer.write(
                            line.toLowerCase(
                                    Locale.ROOT
                            )
                    )

                    writer.newLine()
                }
            }

        } finally {
            reader.close()
        }

        println(
                "PocketBoard dictionary generated: " +
                        outputFile.absolutePath
        )

    } finally {
        connection.disconnect()
    }
}


tasks.register(
        "downloadPocketBoardDictionaries"
) {

    outputs.dir(
            dictionariesOutputDir
    )

    doLast {

        dictionarySources.each {
            String language,
            String dictionaryUrl ->

            downloadAndConvertDictionary(
                    language,
                    dictionaryUrl
            )
        }
    }
}


/*
 * Dictionaries must exist before Android processes assets.
 */
tasks.named("preBuild") {

    dependsOn(
            "downloadPocketBoardDictionaries"
    )
}


/*
 * ============================================================
 * KEYBOARD MAPPING XML VALIDATION
 * ============================================================
 */

tasks.register(
        "validateKeyboardMappings"
) {

    dependsOn("build")

    doLast {

        def factory =
                SchemaFactory.newInstance(
                        XMLConstants.W3C_XML_SCHEMA_NS_URI
                )

        def schema =
                factory.newSchema(
                        new File(
                                "${rootProject.projectDir}/app/keyboard-mapping.xsd"
                        )
                )

        def validator =
                schema.newValidator()

        File xmlRoot =
                new File(
                        "${rootProject.projectDir}/app/src/main/res/xml/"
                )

        File[] keyboardMappings =
                xmlRoot.listFiles(
                        new FilenameFilter() {

                            @Override
                            boolean accept(
                                    File dir,
                                    String name
                            ) {

                                return name.startsWith(
                                        "keyboard_mapping_"
                                ) &&
                                        name.endsWith(
                                                ".xml"
                                        )
                            }
                        }
                )

        if (keyboardMappings == null) {
            return
        }

        for (
                File mappingFile :
                        keyboardMappings
        ) {

            println(
                    "Validating keyboard mapping: " +
                            mappingFile.name
            )

            validator.validate(
                    new StreamSource(
                            mappingFile
                    )
            )
        }
    }
}
